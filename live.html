<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasil Live PTV #3</title>
<script src="config.js"></script>
<style>
  :root{--ink:#37352f;--mute:#787774;--line:#e9e9e7;--soft:#f7f7f5}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{width:min(1100px,92vw);padding:4vh 0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:5vh;gap:24px}
  h1{font-size:clamp(26px,3.6vw,44px);margin:0;line-height:1.15}
  .count{text-align:right}
  .count b{display:block;font-size:clamp(48px,7vw,96px);line-height:1}
  .count span{color:var(--mute);font-size:clamp(14px,1.4vw,18px)}
  .row{display:grid;grid-template-columns:minmax(180px,26%) 1fr 70px;align-items:center;gap:20px;margin:0 0 3.2vh}
  .lbl{font-weight:700;font-size:clamp(16px,1.8vw,24px)}
  .track{height:clamp(34px,5.5vh,56px);background:var(--soft);border-radius:10px;position:relative;overflow:visible}
  .fill{height:100%;border-radius:10px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative}
  .fill::before{content:"";position:absolute;top:-8px;left:10px;right:10px;height:8px;
    background:repeating-linear-gradient(90deg,currentColor 0 26px,transparent 26px 46px);border-radius:4px 4px 0 0}
  .num{font-weight:800;font-size:clamp(20px,2.2vw,30px);text-align:right}
  .foot{color:var(--mute);font-size:14px;margin-top:2vh;display:flex;justify-content:space-between}
  .demo{color:#b35900}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Karakter penulis di ruangan ini</h1>
    <div class="count"><b id="total">0</b><span>peserta sudah mengisi</span></div>
  </div>
  <div id="bars"></div>
  <div class="foot"><span id="status">Memuat...</span><span id="time"></span></div>
</div>
<script>
const CLASSES=[["Arsitek Data","#0063B7"],["Pencerita","#D01012"],["Insinyur Purwarupa","#008C3A"],["Ahli Strategi Kebijakan","#E0B000"]];
const cfg=window.PTV3_CONFIG||{};const url=cfg.APPS_SCRIPT_URL;const every=cfg.REFRESH_MS||5000;
const bars=document.getElementById("bars");
CLASSES.forEach(([n,c],i)=>{bars.insertAdjacentHTML("beforeend",
  `<div class="row"><div class="lbl">${n}</div><div class="track"><div class="fill" id="f${i}" style="background:${c};color:${c}"></div></div><div class="num" id="n${i}">0</div></div>`)});
function render(d){
  const counts=d.counts||{};const max=Math.max(1,...CLASSES.map(([n])=>counts[n]||0));
  CLASSES.forEach(([n],i)=>{const v=counts[n]||0;document.getElementById("f"+i).style.width=(v/max*100)+"%";document.getElementById("n"+i).textContent=v});
  document.getElementById("total").textContent=d.total||0;
  document.getElementById("time").textContent="Diperbarui "+new Date().toLocaleTimeString("id-ID");
}
let demo={total:0,counts:{}};
function tickDemo(){ // data contoh bila URL belum diisi
  const n=CLASSES[Math.floor(Math.random()*4)][0];demo.counts[n]=(demo.counts[n]||0)+1+Math.floor(Math.random()*3);
  demo.total=Object.values(demo.counts).reduce((a,b)=>a+b,0);render(demo);
}
async function tick(){
  if(!url){document.getElementById("status").innerHTML='<span class="demo">Mode contoh: URL Apps Script belum diisi di config.js</span>';tickDemo();return}
  try{const r=await fetch(url+"?t="+Date.now());const d=await r.json();render(d);document.getElementById("status").textContent="Data langsung dari Google Sheets"}
  catch(e){document.getElementById("status").textContent="Gagal memuat, mencoba lagi..."}
}
tick();setInterval(tick,every);
</script>
</body>
</html>
